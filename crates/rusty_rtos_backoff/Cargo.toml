[package]
name = "rusty_rtos_backoff"
description = "backoffAlgorithm remade in Rust: exponential backoff with jitter for network retries, no_std, forbid(unsafe), gated against the C library's own test vectors."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_rtos_backoff"
keywords = ["rtos", "freertos", "embedded", "no-std", "remade-with-rust"]
categories = ["embedded", "no-std", "os"]

[features]
default = ["std"]
std = ["rusty_rtos_backoff-core/std"]
alloc = ["rusty_rtos_backoff-core/alloc"]

[dependencies]
rusty_rtos_backoff-core = { workspace = true }

[lints]
workspace = true
